name: Daily AI Blog Publisher

on:
  schedule:
    # Runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Blog Generation & Publishing
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://onnesha.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || '' }}"
          echo "Triggering automated AI blogging pipeline on $SITE_URL..."
          curl -f -X POST "$SITE_URL/api/cron/publish" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --connect-timeout 30 \
            --max-time 120
